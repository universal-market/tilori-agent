# On a release tag, builds tilori-agent as compiled single-file executables
# (bun build --compile), so the Claude Code plugin can run it without Bun or
# Node, and publishes each one with a <asset>.sha256 file:
#
#   tilori-agent-linux-x64      tilori-agent-linux-x64.sha256
#   tilori-agent-linux-arm64    tilori-agent-linux-arm64.sha256
#   tilori-agent-darwin-x64     tilori-agent-darwin-x64.sha256
#   tilori-agent-darwin-arm64   tilori-agent-darwin-arm64.sha256
#
# A sibling of release-hash.yml rather than part of it: verify-release-hash.sh
# requires every sha256= line in a release-hash run's log to be the bundle's,
# and release-hash.yml's own sha256 stays pinned where it is.
#
# Jobs, and what each may do:
# - build runs the tagged code with a read-only token. It installs with
#   --frozen-lockfile --ignore-scripts, and cross-compiles each target against
#   a Bun runtime downloaded from oven-sh/bun's release and checked against
#   the sha256 pinned below (from bun-v$BUN_VERSION's SHASUMS256.txt, whose
#   signature by Bun's release key, F3DC C08A 8572 C074 9B3E 1888 8EAB 4D40
#   A7B2 2B59, checked out), so the build never fetches an unpinned runtime.
#   The executables ignore .env, bunfig.toml, tsconfig.json and package.json
#   in the current directory, as bin/tilori-agent's `cd /` and --no-env-file
#   do for the source install.
# - smoke runs each executable on a runner of its own platform, read-only:
#   --help exits 0 from / with a temp HOME, and a hostile current directory
#   (bunfig.toml preload, .env moving TILORI_HOME) has no effect.
# - publish holds the only write token and runs no repo code (no checkout,
#   no Bun). It re-hashes the files it uploads against build's outputs.
#
# An asset alone proves nothing, since any writer can upload one: check a
# release with scripts/verify-release-binaries.sh, which ties each .sha256
# asset to this workflow's run on the tag (or on main, for a dispatch) and its
# log. The build is reproducible: the same commit, Bun and runtime give the
# same bytes, whatever the checkout path, so anyone can rebuild and compare.
#
# A pull request that changes this file runs build and smoke only (publish is
# skipped, and a fork's token is read-only anyway), so a change is tested
# before a tag depends on it.
#
# For a tag pushed before this workflow existed, dispatch it on main:
#   gh workflow run release-binaries.yml --ref main -f tag=v0.1.31
name: release-binaries
run-name: release-binaries ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release-binaries.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v0.1.31
        required: true

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  BUN_VERSION: 1.4.3

jobs:
  build:
    # Dispatch only from main. An edited workflow on another branch could drop
    # this line; the verify script checks the run's event and branch instead.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.build.outputs.commit }}
      bun: ${{ steps.build.outputs.bun }}
      linux-x64: ${{ steps.build.outputs.linux-x64 }}
      linux-arm64: ${{ steps.build.outputs.linux-arm64 }}
      darwin-x64: ${{ steps.build.outputs.darwin-x64 }}
      darwin-arm64: ${{ steps.build.outputs.darwin-arm64 }}
    steps:
      - name: Check the tag name
        if: github.event_name != 'pull_request'
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || { echo "not a release tag: $TAG" >&2; exit 1; }
      # Actions pinned by commit; the comment is the release it was.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request builds its own merge commit.
          ref: ${{ github.event_name != 'pull_request' && format('refs/tags/{0}', env.TAG) || '' }}
          persist-credentials: false
      - name: Check the version matches the tag
        if: github.event_name != 'pull_request'
        run: |
          want="export const VERSION = '${TAG#v}';"
          got=$(grep -E '^export const VERSION = ' src/version.ts || true)
          [ "$got" = "$want" ] || { echo "src/version.ts at $TAG says: ${got:-nothing}; expected: $want" >&2; exit 1; }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Fetch the pinned Bun runtimes
        run: |
          [ "$(bun --version)" = "$BUN_VERSION" ] || { echo "expected Bun $BUN_VERSION, got $(bun --version)" >&2; exit 1; }
          # Bun's zip names; sha256 from bun-v1.4.3's SHASUMS256.txt. Change
          # these together with BUN_VERSION.
          cat > "$RUNNER_TEMP/runtimes.sha256" <<'EOF'
          1fc2edac843102909e3a1be1d8d9802cc6071cf074e67e88231f4ffe0f8b397b  bun-linux-x64-baseline.zip
          efa9813da5ed72423bf847f916e8d2c47c0d776add972354026a75e10da9aa21  bun-linux-aarch64.zip
          0fde04e8b092156b97fe6432e899baf16d9ed6ce52cbb4218d2d9c07a2f827ef  bun-darwin-x64-baseline.zip
          80afd4c069b46a6fa8f3ec520bebc750a7843e4a8d5b9583d29ad436c00a3403  bun-darwin-aarch64.zip
          EOF
          mkdir -p "$RUNNER_TEMP/rt" && cd "$RUNNER_TEMP/rt"
          for zip in $(awk '{print $2}' ../runtimes.sha256); do
            curl -fsSL --proto '=https' --tlsv1.2 -o "$zip" "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/$zip"
          done
          sha256sum --strict -c ../runtimes.sha256
          for zip in *.zip; do unzip -q "$zip"; done
      - name: Build, check and hash
        id: build
        run: |
          bun install --frozen-lockfile --ignore-scripts
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          commit=$(git rev-parse HEAD)
          echo "tag=$TAG"; echo "commit=$commit"; echo "bun=$BUN_VERSION"
          { echo "commit=$commit"; echo "bun=$BUN_VERSION"; } >> "$GITHUB_OUTPUT"
          # name, Bun --target, runtime directory, what `file` must say.
          while read -r name target rt want; do
            asset="tilori-agent-$name"
            bun build src/cli.ts --compile --target="$target" \
              --compile-executable-path "$RUNNER_TEMP/rt/$rt/bun" \
              --no-compile-autoload-dotenv --no-compile-autoload-bunfig \
              --no-compile-autoload-tsconfig --no-compile-autoload-package-json \
              --outfile "$out/$asset" </dev/null
            desc=$(file -b "$out/$asset")
            echo "$asset: $desc"
            case "$desc" in *"$want"*) ;; *) echo "$asset is not $want" >&2; exit 1 ;; esac
            sha=$(sha256sum "$out/$asset" | cut -d' ' -f1)
            # These lines in the run log are what verify-release-binaries.sh compares.
            echo "asset=$asset sha256=$sha"
            echo "$name=$sha" >> "$GITHUB_OUTPUT"
          done <<'EOF'
          linux-x64 bun-linux-x64-baseline bun-linux-x64-baseline ELF 64-bit LSB executable, x86-64
          linux-arm64 bun-linux-arm64 bun-linux-aarch64 ELF 64-bit LSB executable, ARM aarch64
          darwin-x64 bun-darwin-x64-baseline bun-darwin-x64-baseline Mach-O 64-bit x86_64 executable
          darwin-arm64 bun-darwin-arm64 bun-darwin-aarch64 Mach-O 64-bit arm64 executable
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: darwin-x64, os: macos-15-intel }
          - { name: darwin-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/bin
      - name: Smoke test
        env:
          ASSET: tilori-agent-${{ matrix.name }}
          WANT_SHA256: ${{ needs.build.outputs[matrix.name] }}
        run: |
          set -eu
          b="$RUNNER_TEMP/bin/$ASSET"
          if command -v sha256sum >/dev/null; then got=$(sha256sum "$b" | cut -d' ' -f1); else got=$(shasum -a 256 "$b" | cut -d' ' -f1); fi
          [ "$got" = "$WANT_SHA256" ] || { echo "$ASSET sha256 $got, build said $WANT_SHA256" >&2; exit 1; }
          chmod +x "$b"; file "$b"
          # Canonical path: macOS's temp dir is under a symlink (/var -> /private/var).
          t=$(cd "$(mktemp -d)" && pwd -P); h="$t/home"; p="$t/project"; m="$t/markers"
          mkdir -p "$h" "$p" "$m"; chmod 700 "$h"
          # --help from / with a temp HOME and nothing else in the environment.
          out=$(cd / && env -i HOME="$h" PATH=/usr/bin:/bin "$b" --help)
          printf '%s\n' "$out" | head -n 1
          printf '%s\n' "$out" | grep -q '^tilori-agent: wake local coding agents' || { echo "unexpected --help output" >&2; exit 1; }
          # A hostile current directory: neither the preload nor the .env may apply.
          printf 'preload = ["./evil.ts"]\n' > "$p/bunfig.toml"
          printf 'require("fs").writeFileSync("%s/preload", "x");\n' "$m" > "$p/evil.ts"
          printf 'TILORI_HOME=%s/evil\n' "$p" > "$p/.env"
          got=$(cd "$p" && env -i HOME="$h" PATH=/usr/bin:/bin "$b" key-path --agent smoke)
          [ ! -e "$m/preload" ] || { echo "bunfig.toml preload ran" >&2; exit 1; }
          [ "$got" = "$h/.config/tilori/agents/smoke.key" ] || { echo ".env applied: key-path said $got" >&2; exit 1; }
          echo "$ASSET ok"

  publish:
    needs: [build, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: ${{ runner.temp }}/bin
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.build.outputs.commit }}
          BUN: ${{ needs.build.outputs.bun }}
          SHA_LINUX_X64: ${{ needs.build.outputs.linux-x64 }}
          SHA_LINUX_ARM64: ${{ needs.build.outputs.linux-arm64 }}
          SHA_DARWIN_X64: ${{ needs.build.outputs.darwin-x64 }}
          SHA_DARWIN_ARM64: ${{ needs.build.outputs.darwin-arm64 }}
        run: |
          set -eu
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || { echo "not a release tag: $TAG" >&2; exit 1; }
          printf '%s\n' "$COMMIT" | grep -Eqx '[0-9a-f]{40}' || { echo "bad commit from build" >&2; exit 1; }
          printf '%s\n' "$BUN" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' || { echo "bad bun version from build" >&2; exit 1; }
          cd "$RUNNER_TEMP/bin"
          files=
          for pair in "linux-x64 $SHA_LINUX_X64" "linux-arm64 $SHA_LINUX_ARM64" "darwin-x64 $SHA_DARWIN_X64" "darwin-arm64 $SHA_DARWIN_ARM64"; do
            set -- $pair; asset="tilori-agent-$1"; want=${2:-}
            printf '%s\n' "$want" | grep -Eqx '[0-9a-f]{64}' || { echo "bad sha256 from build for $asset" >&2; exit 1; }
            [ "$(sha256sum "$asset" | cut -d' ' -f1)" = "$want" ] || { echo "$asset differs from what build hashed" >&2; exit 1; }
            # Same keys and order as tilori-agent.js.sha256, plus the asset name.
            printf 'repo=%s\ntag=%s\ncommit=%s\nbun=%s\nasset=%s\nsha256=%s\n' "$GITHUB_REPOSITORY" "$TAG" "$COMMIT" "$BUN" "$asset" "$want" > "$asset.sha256"
            cat "$asset.sha256"
            files="$files $asset $asset.sha256"
          done
          # release-hash may be creating the same release at the same moment.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Release assets are built by CI from this tag. tilori-agent.js.sha256 (release-hash workflow): check it with scripts/verify-release-hash.sh. tilori-agent-<os>-<arch> and .sha256 (release-binaries workflow): check them with scripts/verify-release-binaries.sh." \
            || { sleep 5; gh release view "$TAG" >/dev/null; }
          gh release upload "$TAG" $files --clobber
